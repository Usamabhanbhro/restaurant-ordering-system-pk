    const playChime = () => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15); // A5
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
      } catch (e) {
        console.warn("Audio Context error", e);
      }
    };

      start.setMinutes(startMin, 0, 0);

      for (let i = 0; i < 5; i++) {
        const slotTime = new Date(start.getTime() + i * 15 * 60000);
        const timeStr = slotTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
        const capacityState = i === 1 ? 'filling' : (i === 3 ? 'full' : 'available');
        slots.push({
          time: timeStr,
          status: capacityState,
          label: `${timeStr}`,
          breakSlot: `Break Slot #${i + 1}`
        });
      }
      return slots;
    };

                          <p className="text-[9px] mt-0.5 opacity-80">{s.breakSlot}</p>
                          <span className={`inline-block mt-1 text-[8px] font-extrabold uppercase px-1 rounded ${
                            s.status === 'available' ? 'bg-emerald-100 text-emerald-800' : (s.status === 'filling' ? 'bg-amber-100 text-amber-800' : 'bg-neutral-200 text-neutral-500')
                          }`}>
                            {s.status}
                          </span>
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Payment Methods */}
                  <div className="space-y-2 pt-2 border-t border-neutral-200">
                    <span className="text-xs font-extrabold text-neutral-900">Venue Direct Payment Rails</span>
                    
                    <div className="grid grid-cols-3 gap-2">
                      {venue.paymentMethods.map(pm => (
                        <button
                          key={pm.id}
                          onClick={() => setSelectedMethod(pm.kind)}
                          className={`py-2 px-1 rounded-2xl border text-center text-xs font-bold transition-all ${
                            selectedMethod === pm.kind
                              ? "bg-neutral-900 text-white border-neutral-900"
                              : "bg-white text-neutral-700 border-neutral-200 hover:bg-neutral-50"
                          }`}
                        >
                          {pm.kind}
                        </button>
                      ))}
                    </div>

                    {/* Active Payment Details Card */}
                    {(() => {
                      const activePM = venue.paymentMethods.find(m => m.kind === selectedMethod) || venue.paymentMethods[0];
                      return (
                        <div className="p-3.5 rounded-2xl bg-white border border-neutral-200/90 shadow-sm space-y-2">
                          <div className="flex items-center justify-between">
                            <span className="text-[10px] font-bold text-neutral-400 uppercase">{activePM.label}</span>
                            <span className="text-xs font-extrabold text-[#EF5A30]">Amount: Rs. {cartSubtotal}</span>
                          </div>
                          
                          <div>
                            <p className="text-[11px] text-neutral-500">Account Title: <strong className="text-neutral-800">{activePM.accountTitle}</strong></p>
                            <div className="flex items-center justify-between mt-1 p-2 rounded-xl bg-neutral-100 font-mono text-xs font-bold">
                              <span>{activePM.accountNumber}</span>
                              <button
                                onClick={() => handleCopy(activePM.accountNumber)}
                                className="px-2 py-0.5 rounded-md bg-white border text-[10px] font-sans font-bold hover:bg-neutral-50"
                              >
                                {copiedText === activePM.accountNumber ? "✓ Copied" : "Copy"}
                              </button>
                            </div>
                          </div>

                          <p className="text-[10px] text-neutral-400 leading-tight">{activePM.instructions}</p>
                        </div>
                      );
                    })()}
                  </div>

                  {/* Transaction ID & Screenshot */}
                  <div className="space-y-2 pt-2 border-t border-neutral-200">
                    <div>
                      <label className="text-xs font-bold text-neutral-900">Transaction Reference ID *</label>
                      <input
                        type="text"
                        placeholder="e.g. EP-9876543210 or Bank Txn ID"
                        value={claimedTxnId}
                        onChange={(e) => setClaimedTxnId(e.target.value)}
                        className="w-full mt-1 px-3 py-2 rounded-xl bg-white border border-neutral-200 text-xs font-mono font-bold focus:ring-1 focus:ring-[#EF5A30] focus:outline-none"
                      />
                    </div>

                    <div className="p-3 rounded-2xl border border-dashed border-neutral-300 bg-neutral-50/50 text-center">
                      <p className="text-[11px] font-bold text-neutral-700">Receipt Screenshot (Optional)</p>
                      <p className="text-[9px] text-neutral-400">Kept 30 days for cashier dispute verification</p>
                      <div className="mt-2 text-xs text-[#EF5A30] font-bold cursor-pointer">📎 Simulating Receipt Attached</div>
                    </div>
                  </div>

                  {/* Terms Acknowledgment */}
                  <div className="flex items-start gap-2 pt-2">
                    <input
                      type="checkbox"
                      id="terms"
                      checked={termsAccepted}
                      onChange={(e) => setTermsAccepted(e.target.checked)}
                      className="mt-0.5 accent-[#EF5A30]"
                    />
                    <label htmlFor="terms" className="text-[10px] text-neutral-500 leading-tight">
                      I understand orders are same-day counter pickup. Orders held 30m past pickup are no-show with no refund (TERMS_DRAFT).
                    </label>
                  </div>
                </div>

                {/* Bottom Checkout CTA */}
                <div className="p-4 bg-white border-t border-neutral-200">
                  <button
                    onClick={handlePlaceOrder}
                    className="w-full py-3.5 rounded-full bg-neutral-900 hover:bg-[#EF5A30] text-white font-extrabold text-xs transition-colors flex items-center justify-between px-6 shadow-md"
                  >
                    <span>Submit Payment Claim</span>
                    <span>Rs. {cartSubtotal}</span>
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 2. UNIFIED STAFF DASHBOARD (Toast / Square Style KDS)
    // =========================================================================
    function StaffDashboard({ venue, orders, setOrders, venue86List, setVenue86List, remoteOrdersPaused, setRemoteOrdersPaused, triggerUndo }) {
      const [activeTab, setActiveTab] = useState("lanes"); // 'lanes' | 'admin'
      const [shiftActive, setShiftActive] = useState(false);

      // Handle Confirm Claim
      const handleConfirmClaim = (orderId) => {
        setOrders(prev => prev.map(o => {
          if (o.id === orderId) {
            return {
              ...o,
              state: "SCHEDULED",
              undoUntil: Date.now() + 300000
            };
          }
          return o;
        }));

        triggerUndo("Payment Confirmed", () => {
          setOrders(prev => prev.map(o => o.id === orderId ? { ...o, state: "PENDING_PAYMENT" } : o));
        });
        playChime();
      };

      // Handle Reject Claim
      const handleRejectClaim = (orderId, reason) => {
        setOrders(prev => prev.map(o => {
          if (o.id === orderId) {
            return {
              ...o,
              rejectionReason: reason,
              undoUntil: Date.now() + 300000
            };
          }
          return o;
        }));

        triggerUndo(`Payment Rejected (${reason})`, () => {
          setOrders(prev => prev.map(o => o.id === orderId ? { ...o, rejectionReason: null } : o));
        });
      };

      // Move to READY
      const handleBumpReady = (orderId) => {
        setOrders(prev => prev.map(o => o.id === orderId ? { ...o, state: "READY" } : o));
        playChime();
      };

      // Mark Handed Over (SERVED)
      const handleMarkServed = (orderId) => {
        setOrders(prev => prev.map(o => o.id === orderId ? { ...o, state: "SERVED" } : o));
      };

      // Mark Refund Done
      const handleRefundDone = (orderId) => {
        setOrders(prev => prev.map(o => o.id === orderId ? { ...o, refundOwed: false } : o));
      };

      // Filter Orders by 5 Lanes
      const pendingClaims = orders.filter(o => o.state === 'PENDING_PAYMENT' && !o.rejectionReason);
      const scheduledOrders = orders.filter(o => o.state === 'SCHEDULED');
      const preparingOrders = orders.filter(o => o.state === 'PREPARING');
      const readyOrders = orders.filter(o => o.state === 'READY');
      const refundOrders = orders.filter(o => o.refundOwed);

      return (
        <div className="flex flex-col h-full bg-slate-900 text-slate-100">
          
          {/* Subheader */}
          <div className="h-12 border-b border-slate-800 px-4 flex items-center justify-between shrink-0 bg-slate-900/90 text-xs">
            <div className="flex items-center gap-3">
              <span className="font-extrabold text-sm text-white">Staff KDS & Cashier Lanes</span>
              <button
                onClick={() => {
                  setShiftActive(prev => !prev);
                  if (!shiftActive) playChime();
                }}
                className={`px-3 py-1 rounded-full font-bold transition-all ${
                  shiftActive ? "bg-emerald-500/20 text-emerald-400 border border-emerald-500/40" : "bg-slate-800 text-slate-400 hover:text-white"
                }`}
              >
                {shiftActive ? "Shift Active 🔔" : "Start Shift (Enable Sound)"}
              </button>
            </div>

            <div className="flex items-center gap-3">
              <button
                onClick={() => setRemoteOrdersPaused(prev => !prev)}
                className={`px-3 py-1 rounded-full font-bold text-[11px] transition-all ${
                  remoteOrdersPaused ? "bg-amber-500/20 text-amber-400 border border-amber-500/40" : "bg-slate-800 text-emerald-400"
                }`}
              >
                {remoteOrdersPaused ? "Remote Orders: PAUSED 🔴" : "Remote Orders: ACTIVE 🟢"}
              </button>

              <button
                onClick={() => setActiveTab(activeTab === "lanes" ? "admin" : "lanes")}
                className="px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold"
              >
                {activeTab === "lanes" ? "Admin Settings ⚙️" : "View Kitchen Lanes"}
              </button>
            </div>
          </div>

          {/* TAB 1: 5 OPERATIONAL LANES */}
          {activeTab === "lanes" && (
            <div className="flex-1 p-3 grid grid-cols-5 gap-3 overflow-hidden min-h-0">
              
              {/* Lane 1: Payments to Confirm */}
              <div className="flex flex-col rounded-2xl bg-slate-950 border border-slate-800/80 overflow-hidden">
                <div className="px-3 py-2 bg-slate-800/60 border-b border-slate-800 flex items-center justify-between text-xs font-bold text-orange-400">
                  <span>PAYMENTS ({pendingClaims.length})</span>
                  <span className="text-[10px] bg-orange-950 px-1.5 py-0.5 rounded text-orange-300">New</span>
                </div>
                <div className="flex-1 p-2 overflow-y-auto no-scrollbar space-y-2">
                  {pendingClaims.map(ord => (
                    <div key={ord.id} className="p-3 rounded-2xl bg-slate-900 border border-orange-500/40 shadow-soft space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="font-extrabold text-sm text-white">{ord.code}</span>
                        <span className="text-[10px] font-bold text-orange-400">Slot: {ord.slot}</span>
                      </div>
                      <div>
                        <p className="text-xs font-bold text-slate-200">{ord.customerName}</p>
                        <p className="text-xs font-black text-emerald-400 mt-0.5">Rs. {ord.total}</p>
                      </div>
                      <div className="p-2 rounded-xl bg-slate-950/80 font-mono text-[11px] text-slate-300">
                        <p className="text-[9px] text-slate-500 uppercase">{ord.paymentMethod}</p>
                        <p className="font-bold text-white">{ord.txnId}</p>
                      </div>
                      <div className="grid grid-cols-2 gap-2 pt-1">
                        <button
                          onClick={() => handleConfirmClaim(ord.id)}
                          className="py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs transition-colors shadow-sm"
                        >
                          Confirm
                        </button>
                        <button
                          onClick={() => handleRejectClaim(ord.id, "NOT_FOUND")}
                          className="py-1.5 rounded-xl bg-slate-800 hover:bg-rose-900/50 text-rose-400 font-extrabold text-xs transition-colors"
                        >
                          Reject
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Lane 2: Scheduled Orders */}
              <div className="flex flex-col rounded-2xl bg-slate-950 border border-slate-800/80 overflow-hidden">
                <div className="px-3 py-2 bg-slate-800/60 border-b border-slate-800 flex items-center justify-between text-xs font-bold text-blue-400">
                  <span>SCHEDULED ({scheduledOrders.length})</span>
                  <span className="text-[10px] text-slate-400">Auto-cook</span>
                </div>
                <div className="flex-1 p-2 overflow-y-auto no-scrollbar space-y-2">
                  {scheduledOrders.map(ord => (
                    <div key={ord.id} className="p-3 rounded-2xl bg-slate-900 border border-slate-800 space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="font-extrabold text-sm text-white">{ord.code}</span>
                        <span className="text-[10px] font-bold text-blue-400">Pickup: {ord.slot}</span>
                      </div>
                      <p className="text-xs font-bold text-slate-300">{ord.customerName}</p>
                      <div className="text-[11px] text-slate-400 space-y-0.5">
                        {ord.items.map((it, i) => (
                          <p key={i}>• {it.qty}x {it.name}</p>
                        ))}
                      </div>
                      <button
                        onClick={() => {
                          setOrders(prev => prev.map(o => o.id === ord.id ? { ...o, state: "PREPARING" } : o));
                          playChime();
                        }}
                        className="w-full py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs"
                      >
                        Start Cooking Now
                      </button>
                    </div>
                  ))}
                </div>
              </div>

              {/* Lane 3: Preparing (Kitchen Active) */}
              <div className="flex flex-col rounded-2xl bg-slate-950 border border-slate-800/80 overflow-hidden">
                <div className="px-3 py-2 bg-slate-800/60 border-b border-slate-800 flex items-center justify-between text-xs font-bold text-amber-400">
                  <span>PREPARING ({preparingOrders.length})</span>
                  <span className="text-[10px] text-emerald-400">Active</span>
                </div>
                <div className="flex-1 p-2 overflow-y-auto no-scrollbar space-y-2">
                  {preparingOrders.map(ord => (
                    <div key={ord.id} className="p-3 rounded-2xl bg-slate-900 border border-amber-500/40 space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="font-extrabold text-sm text-white">{ord.code}</span>
                        <span className="text-[10px] font-bold text-emerald-400">⏱️ Cook: 6m</span>
                      </div>
                      <p className="text-xs font-bold text-slate-300">{ord.customerName}</p>
                      <div className="p-2 rounded-xl bg-slate-950 text-[11px] text-slate-200 space-y-1">
                        {ord.items.map((it, i) => (
                          <div key={i}>
                            <p className="font-bold">• {it.qty}x {it.name}</p>
                            {it.mods.map((m, mi) => (
                              <p key={mi} className="text-[9px] text-[#EF5A30] pl-2">{m}</p>
                            ))}
                            {it.note && <p className="text-[9px] text-amber-400 pl-2">Note: {it.note}</p>}
                          </div>
                        ))}
                      </div>
                      <button
                        onClick={() => handleBumpReady(ord.id)}
                        className="w-full py-2 rounded-xl bg-[#EF5A30] hover:bg-[#D94820] text-white font-extrabold text-xs shadow-md transition-colors"
                      >
                        BUMP (Ready)
                      </button>
                    </div>
                  ))}
                </div>
              </div>

              {/* Lane 4: Ready at Counter */}
              <div className="flex flex-col rounded-2xl bg-slate-950 border border-slate-800/80 overflow-hidden">
                <div className="px-3 py-2 bg-slate-800/60 border-b border-slate-800 flex items-center justify-between text-xs font-bold text-emerald-400">
                  <span>READY ({readyOrders.length})</span>
                  <span className="text-[10px] text-slate-400">Counter</span>
                </div>
                <div className="flex-1 p-2 overflow-y-auto no-scrollbar space-y-2">
                  {readyOrders.map(ord => (
                    <div key={ord.id} className="p-3 rounded-2xl bg-slate-900 border border-emerald-500/40 space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="font-black text-xl text-emerald-400">{ord.code}</span>
                        <span className="text-[10px] text-slate-400">Ready 2m</span>
                      </div>
                      <p className="text-xs font-bold text-slate-300">{ord.customerName}</p>
                      <button
                        onClick={() => handleMarkServed(ord.id)}
                        className="w-full py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs shadow-md transition-colors"
                      >
                        Mark Handed Over
                      </button>
                    </div>
                  ))}
                </div>
              </div>

              {/* Lane 5: Refunds Owed */}
              <div className="flex flex-col rounded-2xl bg-slate-950 border border-slate-800/80 overflow-hidden">
                <div className="px-3 py-2 bg-slate-800/60 border-b border-slate-800 flex items-center justify-between text-xs font-bold text-rose-400">
                  <span>REFUNDS ({refundOrders.length})</span>
                  <span className="text-[10px] text-slate-400">Manual</span>
                </div>
                <div className="flex-1 p-2 overflow-y-auto no-scrollbar space-y-2">
                  {refundOrders.map(ord => (
                    <div key={ord.id} className="p-3 rounded-2xl bg-slate-900 border border-rose-500/40 space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="font-extrabold text-sm text-white">{ord.code}</span>
                        <span className="text-xs font-bold text-rose-400">Rs. {ord.total}</span>
                      </div>
                      <p className="text-xs text-slate-300">{ord.customerName}</p>
                      <p className="text-[10px] text-slate-400">Reason: Customer Cancelled</p>
                      <button
                        onClick={() => handleRefundDone(ord.id)}
                        className="w-full py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs"
                      >
                        Refund Done ✓
                      </button>
                    </div>
                  ))}
                  {refundOrders.length === 0 && (
                    <p className="text-center py-6 text-xs text-slate-500">No refunds pending</p>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* TAB 2: ADMIN SETTINGS & 86 OUT TOGGLE */}
          {activeTab === "admin" && (
            <div className="flex-1 p-6 overflow-y-auto space-y-6">
              <div>
                <h2 className="text-lg font-bold text-white">Day-2 Admin Controls</h2>
                <p className="text-xs text-slate-400">Toggle stock (86) and manage operating parameters</p>
              </div>

              <div className="p-4 rounded-2xl bg-slate-950 border border-slate-800 space-y-3">
                <h3 className="font-bold text-sm text-slate-200">86 Out-of-Stock Toggle</h3>
                <div className="grid grid-cols-2 gap-3">
                  {MOCK_ITEMS.map(it => {
                    const is86 = venue86List[it.id];
                    return (
                      <div key={it.id} className="p-3 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-between">
                        <div>
                          <p className="font-bold text-xs text-white">{it.nameEn}</p>
                          <p className="text-[10px] text-slate-400">Rs. {it.price}</p>
                        </div>
                        <button
                          onClick={() => {
                            setVenue86List(prev => ({ ...prev, [it.id]: !prev[it.id] }));
                          }}
                          className={`px-3 py-1 rounded-full text-xs font-bold ${
                            is86 ? "bg-rose-500/20 text-rose-400 border border-rose-500/40" : "bg-emerald-500/20 text-emerald-400 border border-emerald-500/40"
                          }`}
                        >
                          {is86 ? "Mark In Stock" : "86 (Out of Stock)"}
                        </button>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Render Root Application
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
