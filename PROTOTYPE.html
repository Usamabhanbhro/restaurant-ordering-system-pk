    // Generate upcoming pickup slots
    const getAvailableSlots = () => {
      const slots = [];
      const now = new Date();
      // start at next 10-min interval + 15 min buffer
      const startMin = Math.ceil((now.getMinutes() + 15) / 10) * 10;
      const start = new Date(now);
      start.setMinutes(startMin, 0, 0);

      for (let i = 0; i < 6; i++) {
        const slotTime = new Date(start.getTime() + i * 15 * 60000);
        const timeStr = slotTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
        // Simulating random slot capacity
        const capacityState = i === 1 ? 'filling' : (i === 4 ? 'full' : 'available');
        slots.push({
          time: timeStr,
          status: capacityState,
          label: `${timeStr} (Break Slot #${i + 1})`
        });
      }
      return slots;
    };

      // Find my latest active order from global orders

        const myActive = orders.find(o => o.customerEmail === userProfile.email && o.state !== 'SERVED' && o.state !== 'VOIDED');

          setActiveOrder(myActive);
        }

      // Add Item to Cart with Modifiers
      const handleAddToCart = (customized) => {
        setCart(prev => [...prev, customized]);
        setCustomizingItem(null);
      };

      // Calculate Total
      const cartSubtotal = cart.reduce((acc, item) => {
        const modsDelta = (item.selectedModifiers || []).reduce((mSum, m) => mSum + m.priceDelta, 0);

      }, 0);

        if (!selectedSlot) return alert("Please select a valid pickup slot");

          customerName: userProfile.name,
          customerEmail: userProfile.email,

            qty: c.quantity,
            price: c.price,
            mods: (c.selectedModifiers || []).map(m => m.nameEn),

                className="w-8 h-8 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-xs font-bold text-slate-200"

                {userProfile.name.charAt(0)}

            </div>

            {/* In-App Notice */}
            <div className="bg-emerald-500/10 border border-emerald-500/20 px-3 py-1.5 rounded-lg flex items-center justify-between text-[11px] text-emerald-300">

            {/* VIEW: CART & CHECKOUT (Grubhub / Foodpanda pattern) */}
            {currentTab === "cart" && (

                {cart.length === 0 ? (

                ) : (
                  <>
                    {/* Cart Items */}
                    <div className="space-y-2">
                      {cart.map((c, idx) => (

                    {/* Step 1: Pickup Time Slot Selection with Capacity */}
                    <div className="bg-slate-900 border border-slate-800 p-3 rounded-2xl space-y-2">
                      <label className="text-xs font-bold text-white block">
                        ⏰ Select 15-Min Break Pickup Slot
                      </label>
                      <select
                        value={selectedSlot}
                        onChange={(e) => setSelectedSlot(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"
                      >
                        <option value="">-- Choose scheduled pickup time --</option>
                        {availableSlots.map(s => (
                          <option

                            value={s.time}

                      </select>
                      <p className="text-[10px] text-slate-400">

                      </p>
                    </div>

                    {/* Step 2: Payment Method Details */}
                    <div className="bg-slate-900 border border-slate-800 p-3 rounded-2xl space-y-2.5">
                      <label className="text-xs font-bold text-white block">

                      <div className="grid grid-cols-3 gap-1.5 text-center text-xs">
                        {['easypaisa', 'sadapay', 'bank'].map(method => (
                          <button
                            key={method}

                            onClick={() => setSelectedPaymentMethod(method)}
                            className={`p-2 rounded-xl border text-[11px] font-semibold capitalize transition-all ${
                              selectedPaymentMethod === method
                                ? "bg-emerald-950 border-emerald-500 text-emerald-300"
                                : "bg-slate-950 border-slate-800 text-slate-400"

                          >
                            {method}
                          </button>
                        ))}
                      </div>

                      {/* Payment Instructions Details Box */}
                      <div className="p-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs space-y-1">
                        <div className="text-slate-400 font-medium text-[10px]">
                          Send <span className="font-bold text-emerald-400">Rs. {cartSubtotal}</span> to:
                        </div>
                        <div className="font-mono text-white text-xs font-bold">
                          {venue.paymentDetails[selectedPaymentMethod].number || venue.paymentDetails[selectedPaymentMethod].iban}
                        </div>
                        <div className="text-slate-400 text-[10px]">
                          Title: {venue.paymentDetails[selectedPaymentMethod].name}
                        </div>
                      </div>

                      {/* Transaction ID Submission */}
                      <div className="space-y-1 pt-1">
                        <label className="text-[11px] text-slate-300 font-medium block">
                          Enter Bank Transaction Reference ID <span className="text-emerald-400">*</span>

                        <input
                          type="text"
                          value={paymentTxnId}

                          className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs font-mono text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500"
                        />
                      </div>
                    </div>

                    {/* Pre-Payment Terms & No-Show Condition */}
                    <div className="p-3 bg-slate-900 border border-slate-800 rounded-2xl text-[11px] text-slate-400 space-y-2">
                      <label className="flex items-start gap-2 cursor-pointer text-slate-300 font-medium">
                        <input
                          type="checkbox"
                          checked={termsAccepted}
                          onChange={(e) => setTermsAccepted(e.target.checked)}

                      </label>
                    </div>

                    {/* Submit Order Button */}
                    <button

                    >
                      <span>Submit Pre-Order • Rs. {cartSubtotal}</span>
                    </button>
                  </>
                )}
              </div>
            )}

            {/* VIEW: 5-STATE LIVE ORDER TRACKING */}
            {currentTab === "status" && (
              <div className="space-y-4">
                {!activeOrder ? (
                  <div className="text-center py-12 text-slate-500">
                    <p className="text-3xl mb-2">📦</p>
                    <p className="text-xs">No active order in progress.</p>
                  </div>
                ) : (
                  <div className="space-y-4">
                    {/* Status Header Card */}
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center space-y-2">
                      <div className="text-xs text-slate-400">Order ID: <span className="font-mono text-white font-bold">{activeOrder.id}</span></div>

                      {/* State 1: Awaiting Payment */}
                      {activeOrder.state === "PENDING_PAYMENT" && (
                        <div className="py-3">
                          <div className="w-12 h-12 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/40 mx-auto flex items-center justify-center text-xl animate-pulse">

                          </div>
                          <h3 className="font-bold text-sm text-white mt-2">Awaiting Payment Confirmation</h3>

                        </div>
                      )}

                      {/* State 2: Confirmed & Scheduled */}
                      {activeOrder.state === "SCHEDULED" && (
                        <div className="py-3">
                          <div className="w-12 h-12 rounded-full bg-blue-500/20 text-blue-400 border border-blue-500/40 mx-auto flex items-center justify-center text-xl">
                            📅
                          </div>
                          <h3 className="font-bold text-sm text-white mt-2">Order Confirmed!</h3>
                          <p className="text-[11px] text-blue-300 mt-1">Scheduled for pickup at <span className="font-bold">{activeOrder.slot}</span></p>
                        </div>
                      )}

                      {/* State 3: Preparing */}
                      {activeOrder.state === "PREPARING" && (
                        <div className="py-3">
                          <div className="w-12 h-12 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 mx-auto flex items-center justify-center text-xl animate-spin">
                            🍳
                          </div>
                          <h3 className="font-bold text-sm text-white mt-2">Kitchen is Preparing Food</h3>
                          <p className="text-[11px] text-emerald-300 mt-1">Freshly cooked for your {activeOrder.slot} slot.</p>
                        </div>
                      )}

                      {/* State 4: Ready for Pickup */}
                      {activeOrder.state === "READY" && (
                        <div className="py-3 bg-emerald-950/40 border border-emerald-500/50 rounded-xl p-3">
                          <div className="text-3xl animate-bounce">🔔</div>
                          <h3 className="font-bold text-base text-emerald-400 mt-1">Ready at Counter #2!</h3>
                          <p className="text-xs text-white font-medium">Please show Order #{activeOrder.id} to collect.</p>
                        </div>
                      )}

                      {/* State 5 / Neutral Cancel */}
                      {activeOrder.state === "VOIDED" && (
                        <div className="py-3">
                          <div className="w-12 h-12 rounded-full bg-slate-800 text-slate-400 mx-auto flex items-center justify-center text-xl">
                            ✕
                          </div>
                          <h3 className="font-bold text-sm text-white mt-2">Order Closed</h3>
                          <p className="text-[11px] text-slate-400 mt-1">This order could not be completed.</p>
                        </div>
                      )}
                    </div>

                    {/* Order Summary & Modifiers */}
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-3 space-y-2 text-xs">
                      <div className="font-bold text-white border-b border-slate-800 pb-1.5 flex justify-between">
                        <span>Items Ordered</span>
                        <span>Rs. {activeOrder.total}</span>
                      </div>
                      {activeOrder.items.map((it, i) => (
                        <div key={i} className="flex justify-between text-[11px] text-slate-300">
                          <div>
                            <span>{it.qty}x {it.name}</span>
                            {it.mods.length > 0 && <span className="block text-[10px] text-emerald-400">{it.mods.join(", ")}</span>}
                          </div>
                          <span className="font-mono">Rs. {it.price * it.qty}</span>
                        </div>
                      ))}
                    </div>

                    {/* Cancel Button (Active until preparation) */}
                    {activeOrder.state === "PENDING_PAYMENT" || activeOrder.state === "SCHEDULED" ? (
                      <button
                        onClick={() => onCancelOrder(activeOrder.id)}
                        className="w-full py-2.5 rounded-xl bg-slate-900 border border-red-500/40 hover:bg-red-950/30 text-red-400 font-semibold text-xs transition-colors"
                      >
                        Cancel Order
                      </button>
                    ) : null}
                  </div>
                )}
              </div>
            )}

            {/* VIEW: PROFILE (Perks Wallet) */}
            {currentTab === "profile" && (
              <div className="space-y-4 text-xs">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-full bg-emerald-600 text-white flex items-center justify-center font-bold text-base">
                      {userProfile.name.charAt(0)}
                    </div>
                    <div>
                      <h4 className="font-bold text-sm text-white">{userProfile.name}</h4>
                      <p className="text-[11px] text-slate-400 font-mono">{userProfile.email}</p>
                    </div>
                  </div>

                  <div className="p-2.5 bg-slate-950 rounded-xl border border-slate-800 space-y-1">
                    <div className="text-[10px] text-slate-500 uppercase tracking-wider font-bold">Affiliation Badge</div>
                    <div className="flex items-center justify-between">
                      <span className="text-emerald-400 font-semibold">{userProfile.affiliation} Student</span>
                      <span className="text-[10px] bg-emerald-950 text-emerald-300 px-2 py-0.5 rounded border border-emerald-800">Verified</span>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>

          {/* ITEM CUSTOMIZATION MODAL (Single Modal Design) */}
          {customizingItem && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-t-3xl sm:rounded-2xl p-4 max-h-[85vh] flex flex-col animate-in fade-in slide-in-from-bottom-5">
                <div className="flex justify-between items-start mb-2">
                  <div>
                    <h3 className="font-bold text-sm text-white">{customizingItem.nameEn}</h3>
                    <p className="text-xs text-emerald-400 font-bold">Base: Rs. {customizingItem.price}</p>
                  </div>
                  <button
                    onClick={() => setCustomizingItem(null)}
                    className="text-slate-400 hover:text-white text-lg font-bold"
                  >
                    ✕
                  </button>
                </div>

                {/* Modifiers List */}
                <div className="flex-1 overflow-y-auto no-scrollbar space-y-3 my-2 text-xs">
                  {customizingItem.modifierGroups.map(group => (
                    <div key={group.id} className="space-y-1.5">
                      <div className="font-bold text-slate-300 text-[11px] uppercase tracking-wider">{group.title}</div>
                      <div className="space-y-1">
                        {group.modifiers.map(mod => (
                          <label key={mod.id} className="flex items-center justify-between p-2 rounded-xl bg-slate-950 border border-slate-800 cursor-pointer hover:border-slate-700">

                              <input type="checkbox" className="accent-emerald-500" />
                              <span className="text-slate-200">{mod.nameEn}</span>

                  <div className="space-y-1">

                      type="text"
                      maxLength="40"
                      placeholder="e.g. extra crispy, cut in half"

                    />
                  </div>
                </div>

                <button
                  onClick={() => handleAddToCart({ ...customizingItem, quantity: 1, selectedModifiers: [], note: "" })}
                  className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-emerald-950 transition-colors"
                >
                  Add to Tray • Rs. {customizingItem.price}
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 2. UNIFIED STAFF DASHBOARD COMPONENT (5 Lanes)
    // =========================================================================
    function StaffDashboard({ venue, orders, setOrders, venue86List, setVenue86List, remoteOrdersPaused, setRemoteOrdersPaused, triggerUndo }) {
      const [shiftActive, setShiftActive] = useState(false);
      const [adminModalOpen, setAdminModalOpen] = useState(false);
      const [activeLaneTab, setActiveLaneTab] = useState("all"); // 'all' | 'payments' | 'scheduled' | 'prep' | 'ready' | 'refunds'
      const [rejectingOrder, setRejectingOrder] = useState(null);
      const [adminPinInput, setAdminPinInput] = useState("");

      // Lane Action Handlers
      const handleConfirmPayment = (orderId) => {
        setOrders(prev => prev.map(o => o.id === orderId ? { ...o, state: 'SCHEDULED', undoUntil: Date.now() + 300000 } : o));
        triggerUndo(`Payment for ${orderId} confirmed`, () => {
          setOrders(prev => prev.map(o => o.id === orderId ? { ...o, state: 'PENDING_PAYMENT' } : o));
        });
      };

      const handleRejectPayment = (orderId, reason) => {
        setOrders(prev => prev.map(o => o.id === orderId ? { ...o, state: 'VOIDED', rejectionReason: reason } : o));
        setRejectingOrder(null);
        triggerUndo(`Payment for ${orderId} rejected (${reason})`, () => {
          setOrders(prev => prev.map(o => o.id === orderId ? { ...o, state: 'PENDING_PAYMENT', rejectionReason: null } : o));
        });
      };

      const handleBumpReady = (orderId) => {
        setOrders(prev => prev.map(o => o.id === orderId ? { ...o, state: 'READY' } : o));
      };

      const handleMarkServed = (orderId) => {
        setOrders(prev => prev.map(o => o.id === orderId ? { ...o, state: 'SERVED' } : o));
      };

      // Filter orders per lane
      const lanePayments = orders.filter(o => o.state === 'PENDING_PAYMENT');
      const laneScheduled = orders.filter(o => o.state === 'SCHEDULED');
      const lanePrep = orders.filter(o => o.state === 'PREPARING');
      const laneReady = orders.filter(o => o.state === 'READY');
      const laneRefunds = orders.filter(o => o.state === 'VOIDED' && o.paymentMethod);

      return (
        <div className="flex flex-col h-full bg-slate-950 text-slate-100">
          {/* Header Bar */}
          <div className="bg-slate-900 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between shrink-0">
            <div className="flex items-center gap-3">
              <span className="font-bold text-sm text-white">{venue.name} — Staff Operations</span>
              <span className="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">Role: Operator</span>
            </div>

            <div className="flex items-center gap-2 text-xs">
              {/* Shift Start Audio Banner */}
              {!shiftActive ? (
                <button
                  onClick={() => setShiftActive(true)}
                  className="px-3 py-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg transition-colors flex items-center gap-1.5 shadow-md shadow-amber-950/50 animate-pulse"
                >
                  <span>🔔 Tap to Start Shift & Enable Audio</span>
                </button>
              ) : (
                <span className="px-2.5 py-1 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 rounded-lg font-medium flex items-center gap-1">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  Audio Alerts Active
                </span>
              )}

              {/* Pause Remote Orders Switch */}
              <button
                onClick={() => setRemoteOrdersPaused(!remoteOrdersPaused)}
                className={`px-3 py-1 rounded-lg font-semibold border transition-all ${
                  remoteOrdersPaused
                    ? "bg-red-500 text-white border-red-400"
                    : "bg-slate-800 text-slate-300 border-slate-700 hover:text-white"
                }`}
              >
                {remoteOrdersPaused ? "🛑 Online Paused" : "🟢 Online Active"}
              </button>

              {/* Admin Panel Modal Trigger */}
              <button
                onClick={() => setAdminModalOpen(true)}
                className="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold rounded-lg border border-slate-700"
              >
                ⚙️ Admin Tab (PIN)
              </button>
            </div>
          </div>

          {/* 5-Lanes Unified View */}
          <div className="flex-1 overflow-x-auto overflow-y-hidden p-3 flex gap-3">
            {/* LANE 1: PAYMENTS TO CONFIRM */}
            <div className="flex-1 min-w-[260px] max-w-[320px] bg-slate-900/70 border border-slate-800 rounded-2xl flex flex-col overflow-hidden">
              <div className="bg-amber-950/40 border-b border-amber-800/40 p-2.5 flex items-center justify-between text-xs font-bold text-amber-300">
                <span>💳 Payments to Confirm</span>
                <span className="px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-400 font-mono text-[10px]">{lanePayments.length}</span>
              </div>
              <div className="flex-1 overflow-y-auto no-scrollbar p-2 space-y-2">
                {lanePayments.map(ord => (
                  <div key={ord.id} className="bg-slate-900 border border-slate-800 hover:border-amber-500/50 p-3 rounded-xl space-y-2 text-xs">
                    <div className="flex justify-between font-bold text-white">
                      <span>{ord.id} ({ord.slot})</span>
                      <span className="text-emerald-400">Rs. {ord.total}</span>
                    </div>
                    <div className="text-[11px] text-slate-300">Customer: <span className="font-semibold">{ord.customerName}</span></div>

                    <div className="bg-slate-950 p-2 rounded-lg border border-slate-800 font-mono text-[10px] text-slate-400">
                      <div>Method: <span className="text-slate-200">{ord.paymentMethod}</span></div>
                      <div>Txn ID: <span className="text-amber-400 font-bold">{ord.txnId}</span></div>
                    </div>

                    <div className="flex gap-1.5 pt-1">
                      <button
                        onClick={() => handleConfirmPayment(ord.id)}
                        className="flex-1 py-1.5 bg-emerald-600 hover:bg-emerald-500 font-bold text-white text-[11px] rounded-lg transition-colors"
                      >
                        ✓ Confirm
                      </button>
                      <button
                        onClick={() => setRejectingOrder(ord)}
                        className="px-2.5 py-1.5 bg-slate-800 hover:bg-red-950/60 text-red-400 font-bold text-[11px] rounded-lg border border-slate-700"
                      >
                        ✕ Reject
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* LANE 2: SCHEDULED (Pre-orders countdown) */}
            <div className="flex-1 min-w-[260px] max-w-[320px] bg-slate-900/70 border border-slate-800 rounded-2xl flex flex-col overflow-hidden">
              <div className="bg-blue-950/40 border-b border-blue-800/40 p-2.5 flex items-center justify-between text-xs font-bold text-blue-300">
                <span>⏰ Scheduled Pre-Orders</span>
                <span className="px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-400 font-mono text-[10px]">{laneScheduled.length}</span>
              </div>
              <div className="flex-1 overflow-y-auto no-scrollbar p-2 space-y-2">
                {laneScheduled.map(ord => (
                  <div key={ord.id} className="bg-slate-900 border border-slate-800 p-3 rounded-xl space-y-2 text-xs">
                    <div className="flex justify-between font-bold text-white">
                      <span>{ord.id} (Slot: {ord.slot})</span>
                      <span className="text-[11px] px-2 py-0.5 rounded bg-blue-500/20 text-blue-300">Starts in ~10m</span>
                    </div>
                    <div className="text-[11px] text-slate-300 font-semibold">{ord.customerName}</div>
                    <div className="text-[10px] text-slate-400">
                      {ord.items.map(i => `${i.qty}x ${i.name}`).join(", ")}
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* LANE 3: ACTIVE PREPARING */}
            <div className="flex-1 min-w-[260px] max-w-[320px] bg-slate-900/70 border border-slate-800 rounded-2xl flex flex-col overflow-hidden">
              <div className="bg-emerald-950/40 border-b border-emerald-800/40 p-2.5 flex items-center justify-between text-xs font-bold text-emerald-300">
                <span>🍳 Active Kitchen Prep</span>
                <span className="px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 font-mono text-[10px]">{lanePrep.length}</span>
              </div>
              <div className="flex-1 overflow-y-auto no-scrollbar p-2 space-y-2">
                {lanePrep.map(ord => (
                  <div key={ord.id} className="bg-slate-900 border border-slate-800 p-3 rounded-xl space-y-2 text-xs">
                    <div className="flex justify-between font-bold text-white">
                      <span>{ord.id} • Slot: {ord.slot}</span>
                      <span className="text-emerald-400 font-mono text-[11px]">Cook: 6m</span>
                    </div>
                    <div className="space-y-1 py-1">
                      {ord.items.map((it, idx) => (
                        <div key={idx} className="text-xs text-white">
                          <span className="font-bold text-emerald-400">{it.qty}x</span> {it.name}
                          {it.mods.map((m, mi) => (
                            <span key={mi} className="block text-[10px] text-amber-400 ml-3">• {m}</span>
                          ))}
                          {it.note && <span className="block text-[10px] text-slate-400 italic ml-3">"{it.note}"</span>}
                        </div>
                      ))}
                    </div>
                    <button
                      onClick={() => handleBumpReady(ord.id)}
                      className="w-full py-2 bg-emerald-600 hover:bg-emerald-500 font-bold text-white text-xs rounded-lg transition-colors shadow"
                    >
                      ✓ Mark Ready (Counter #2)
                    </button>
                  </div>
                ))}
              </div>
            </div>

            {/* LANE 4: READY FOR PICKUP */}
            <div className="flex-1 min-w-[260px] max-w-[320px] bg-slate-900/70 border border-slate-800 rounded-2xl flex flex-col overflow-hidden">
              <div className="bg-purple-950/40 border-b border-purple-800/40 p-2.5 flex items-center justify-between text-xs font-bold text-purple-300">
                <span>🔔 Ready at Counter</span>
                <span className="px-2 py-0.5 rounded-full bg-purple-500/20 text-purple-400 font-mono text-[10px]">{laneReady.length}</span>
              </div>
              <div className="flex-1 overflow-y-auto no-scrollbar p-2 space-y-2">
                {laneReady.map(ord => (
                  <div key={ord.id} className="bg-slate-900 border border-slate-800 p-3 rounded-xl space-y-2 text-xs">
                    <div className="flex justify-between font-bold text-white">
                      <span>{ord.id}</span>
                      <span className="text-[10px] px-2 py-0.5 rounded bg-purple-500/20 text-purple-300">Ready 2m</span>
                    </div>
                    <div className="text-xs text-slate-300 font-semibold">{ord.customerName}</div>
                    <button
                      onClick={() => handleMarkServed(ord.id)}
                      className="w-full py-2 bg-slate-800 hover:bg-slate-700 font-bold text-slate-200 text-xs rounded-lg border border-slate-700"
                    >
                      Handed Over (Served)
                    </button>
                  </div>
                ))}
              </div>
            </div>

            {/* LANE 5: REFUNDS OWED */}
            <div className="flex-1 min-w-[260px] max-w-[320px] bg-slate-900/70 border border-slate-800 rounded-2xl flex flex-col overflow-hidden">
              <div className="bg-red-950/40 border-b border-red-800/40 p-2.5 flex items-center justify-between text-xs font-bold text-red-300">
                <span>💸 Refunds Owed</span>
                <span className="px-2 py-0.5 rounded-full bg-red-500/20 text-red-400 font-mono text-[10px]">{laneRefunds.length}</span>
              </div>
              <div className="flex-1 overflow-y-auto no-scrollbar p-2 space-y-2">
                {laneRefunds.map(ord => (
                  <div key={ord.id} className="bg-slate-900 border border-slate-800 p-3 rounded-xl space-y-2 text-xs">
                    <div className="flex justify-between font-bold text-white">
                      <span>{ord.id}</span>
                      <span className="text-red-400">Rs. {ord.total}</span>
                    </div>
                    <div className="text-[11px] text-slate-300">{ord.customerName}</div>
                    <div className="text-[10px] text-slate-400 font-mono">Reason: {ord.rejectionReason || "Student Cancel"}</div>
                    <button
                      onClick={() => setOrders(prev => prev.filter(o => o.id !== ord.id))}
                      className="w-full py-1.5 bg-red-950 hover:bg-red-900 border border-red-800 text-red-200 text-[11px] font-bold rounded-lg transition-colors"
                    >
                      ✓ Manual Refund Done
                    </button>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* PAYMENT REJECTION MODAL (Distinguishing WRONG_AMOUNT vs NOT_FOUND with Admin PIN) */}
          {rejectingOrder && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 max-w-sm w-full space-y-4">
                <h3 className="font-bold text-sm text-white">Reject Payment Claim — {rejectingOrder.id}</h3>
                <p className="text-xs text-slate-400">Choose reason for rejecting student's payment claim:</p>

                <div className="space-y-2 text-xs">
                  <button
                    onClick={() => handleRejectPayment(rejectingOrder.id, "WRONG_AMOUNT")}
                    className="w-full text-left p-3 rounded-xl bg-slate-950 border border-slate-800 hover:border-slate-700"
                  >
                    <div className="font-bold text-amber-400">⚠️ Wrong Amount (Underpaid)</div>
                    <div className="text-[10px] text-slate-400">No strike. Student can send remaining amount before cutoff.</div>
                  </button>

                  <button
                    onClick={() => handleRejectPayment(rejectingOrder.id, "PAYMENT_NOT_FOUND")}
                    className="w-full text-left p-3 rounded-xl bg-slate-950 border border-slate-800 hover:border-red-500/50"
                  >
                    <div className="font-bold text-red-400">⛔ Payment Not Found in Bank / Fake Txn</div>
                    <div className="text-[10px] text-slate-400">Records 1 strike after 5m undo window. 3 strikes blocks user.</div>
                  </button>
                </div>

                <button
                  onClick={() => setRejectingOrder(null)}
                  className="w-full py-2 text-xs text-slate-400 hover:text-white"
                >
                  Cancel
                </button>
              </div>
            </div>
          )}

          {/* ADMIN MANAGEMENT TAB OVERLAY (Menu 86 toggles, Operating hours, Customer unblocking) */}
          {adminModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-md w-full space-y-5 max-h-[90vh] overflow-y-auto no-scrollbar">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-base text-white">⚙️ Venue Admin Control</h3>
                  <button onClick={() => setAdminModalOpen(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>

                {/* 86 Live Item Toggle */}
                <div className="space-y-2">
                  <h4 className="text-xs font-bold text-slate-300 uppercase tracking-wider">86 Item Stock Toggles</h4>
                  <div className="space-y-1.5 text-xs">
                    {MOCK_ITEMS.map(it => (
                      <div key={it.id} className="flex items-center justify-between p-2.5 rounded-xl bg-slate-950 border border-slate-800">
                        <span className="text-white font-medium">{it.nameEn}</span>
                        <button
                          onClick={() => setVenue86List(prev => ({ ...prev, [it.id]: !prev[it.id] }))}
                          className={`px-3 py-1 rounded-lg text-xs font-bold transition-colors ${
                            venue86List[it.id] ? "bg-red-500 text-white" : "bg-emerald-950 text-emerald-400 border border-emerald-800"
                          }`}
                        >
                          {venue86List[it.id] ? "86'd (Out of Stock)" : "In Stock"}
                        </button>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Remote Hours Configuration */}
                <div className="space-y-2 pt-2 border-t border-slate-800">
                  <h4 className="text-xs font-bold text-slate-300 uppercase tracking-wider">Remote Pre-Order Schedule</h4>
                  <div className="grid grid-cols-2 gap-2 text-xs">
                    <div>
                      <label className="text-[10px] text-slate-400 block mb-1">Open Time</label>
                      <input type="text" defaultValue="08:00" className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white font-mono" />
                    </div>
                    <div>
                      <label className="text-[10px] text-slate-400 block mb-1">Close Time</label>
                      <input type="text" defaultValue="22:00" className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white font-mono" />
                    </div>
                  </div>
                </div>

                <button
                  onClick={() => setAdminModalOpen(false)}
                  className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 font-bold text-xs rounded-xl text-white transition-colors"
                >
                  Save & Return to Shifts
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Render the Application
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
