<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Brand Palette Definition -->
    <style>
      .brand-bg { fill: #FF5436; }
      .brand-symbol { fill: #FFFFFF; fill-rule: evenodd; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect class="brand-bg" width="800" height="800" rx="160" />

  <!-- Queueless Brand Symbol: The Velocity Platter -->
  <g class="brand-symbol">
    <!-- Plume 01: Top Aerodynamic Streak -->
    <path d="M 235 285 
             C 310 290, 410 265, 545 220 
             L 495 265 
             C 415 275, 320 295, 235 285 Z" />

    <!-- Plume 02: Mid Velocity Flow -->
    <path d="M 195 348 
             C 285 352, 420 325, 595 272 
             L 535 325 
             C 425 338, 305 362, 195 348 Z" />

    <!-- Plume 03: The Kinetic Serving Vessel (Bowl Outline) -->
    <path d="M 205 435 
             C 275 425, 470 380, 615 330 
             C 570 470, 470 545, 345 545 
             C 260 545, 215 500, 205 435 Z
             M 245 448 
             C 255 485, 290 512, 350 512 
             C 435 512, 515 460, 560 365 
             C 445 405, 300 440, 245 448 Z" />
  </g>
</svg>
